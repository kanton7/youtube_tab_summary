<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>태그 한 번 툭</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <main id="root" aria-live="polite"></main>

  <!-- 유튜브 영상 페이지일 때 -->
  <template id="tpl-video">
    <div class="popup-body">
      <img class="thumb" id="thumb" alt="" width="288" height="162">
      <div>
        <h1 class="popup-title video-title" id="title"></h1>
        <p class="popup-channel" id="channel" hidden></p>
      </div>
      <div class="popup-tags">
        <div class="tag-list" id="tags"></div>
      </div>
    </div>
    <div class="popup-foot">
      <span class="popup-hint" id="status"></span>
      <button type="button" class="link-btn" id="open-list"></button>
    </div>
  </template>

  <!-- 유튜브가 아닐 때 -->
  <template id="tpl-notice">
    <div class="popup-notice">
      <p>유튜브 영상 페이지에서 눌러주세요</p>
      <button type="button" class="btn" id="open-list">보관함 열기</button>
    </div>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
